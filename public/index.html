<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#faf0f4">
<title>音乐 · 小克&小猫</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#f2a8c0;--pink-deep:#e07090;--bg:#faf0f4;--card:#fff;
  --text:#333;--text2:#888;--border:rgba(240,160,190,0.25);
  --active:#e07090;--shadow:0 4px 20px rgba(224,112,144,0.15);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
/* ====== 顶部导航 ====== */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:env(safe-area-inset-top,0) 16px 0;background:var(--bg);border-bottom:1px solid var(--border)}
/* 播放页隐藏顶部导航，用小胶囊替代 */
body.play-active .nav{display:none}
body.play-active .main{padding-top:0}
.nav-inner{display:flex;align-items:center;height:52px;gap:12px}
.nav-back{width:32px;height:32px;border:none;background:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav-title{flex:1;font-size:17px;font-weight:600;color:var(--text)}
.nav-login-btn{font-size:13px;color:var(--pink-deep);border:1px solid var(--pink);border-radius:20px;padding:4px 12px;background:none;cursor:pointer}
/* ====== 底部tab ====== */
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg);border-top:1px solid var(--border);
  padding:0 0 env(safe-area-inset-bottom,0);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0;cursor:pointer;font-size:11px;color:var(--text2);gap:3px;transition:color .2s}
.tab.active{color:var(--active)}
.tab-icon{font-size:22px}
/* ====== 主内容 ====== */
.main{padding-top:calc(52px + env(safe-area-inset-top,0));padding-bottom:calc(56px + env(safe-area-inset-bottom,0))}
.page{display:none;min-height:100%}
.page.active{display:block}
/* ====== 播放页 ====== */
/* 顶部小胶囊导航 */
.top-nav-capsule{display:flex;align-items:center;margin:10px 48px 0;padding:5px 10px;gap:6px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.55);border-radius:999px;box-shadow:0 2px 10px rgba(224,112,144,.10)}
.tnc-btn{background:none;border:none;cursor:pointer;color:var(--text2);padding:3px;display:flex;align-items:center;-webkit-tap-highlight-color:transparent}
.tnc-btn svg{width:17px;height:17px;fill:currentColor}
.tnc-mid{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2)}
.tnc-mid svg{width:18px;height:18px;fill:currentColor}
/* 5卡叠叠拍立得轮播（绝对定位叠加） */
.cover-carousel{position:relative;height:230px;padding:10px 0 0;overflow:visible;touch-action:pan-y;user-select:none}
.covers-track{position:relative;width:100%;height:100%}
.cover-item{position:absolute;top:50%;left:50%;transform-origin:center center;transition:all .4s cubic-bezier(.25,.46,.45,.94);cursor:pointer}
.cover-wrap{display:flex;flex-direction:column;align-items:center;overflow:hidden;background:rgba(252,232,237,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cover-inner{overflow:hidden;flex-shrink:0}
.cover-inner img{width:100%;height:100%;object-fit:cover;display:block}
.cover-placeholder{width:100%;height:100%;background:rgba(242,168,192,.35);display:flex;align-items:center;justify-content:center;font-size:28px}
/* 歌名在中间卡片底部白区 */
.cover-title{width:100%;padding:5px 8px 0;text-align:center;display:none}
.cover-item.center .cover-title{display:block}
.song-name{font-size:12px;font-weight:700;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
/* 各档位 */
.cover-item.far-prev{transform:translate(-50%,-50%) translateX(-130px) scale(.52);opacity:.38;z-index:1}
.cover-item.far-next{transform:translate(-50%,-50%) translateX(130px) scale(.52);opacity:.38;z-index:1}
.cover-item.far-prev .cover-wrap,.cover-item.far-next .cover-wrap{width:150px;height:auto;padding:7px 7px 12px;border-radius:20px;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.cover-item.far-prev .cover-inner,.cover-item.far-next .cover-inner{width:136px;height:136px;border-radius:16px}
.cover-item.prev{transform:translate(-50%,-50%) translateX(-80px) scale(.70);opacity:.68;z-index:2}
.cover-item.next{transform:translate(-50%,-50%) translateX(80px) scale(.70);opacity:.68;z-index:2}
.cover-item.prev .cover-wrap,.cover-item.next .cover-wrap{width:150px;height:auto;padding:7px 7px 12px;border-radius:20px;box-shadow:0 5px 16px rgba(0,0,0,.15)}
.cover-item.prev .cover-inner,.cover-item.next .cover-inner{width:136px;height:136px;border-radius:16px}
.cover-item.center{transform:translate(-50%,-50%) translateX(0) scale(1);opacity:1;z-index:5}
.cover-item.center .cover-wrap{width:150px;height:auto;padding:7px 7px 14px;border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.cover-item.center .cover-inner{width:136px;height:136px;border-radius:16px}
/* 歌词3行（小字） */
.lyrics{text-align:center;padding:6px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:52px;overflow:hidden}
.lyric-line{font-size:11px;color:var(--text2);line-height:1.65;opacity:.4;transition:all .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lyric-line.active{opacity:1;color:var(--pink-deep);font-weight:600;font-size:12px}
/* 控制胶囊（参考图二：更薄，无时间，爱心圈） */
.controls-capsule{margin:6px 28px 0;padding:7px 12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(28px) saturate(180%) brightness(1.08);backdrop-filter:blur(28px) saturate(180%) brightness(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.70),0 2px 14px rgba(0,0,0,.09);border:.5px solid rgba(255,255,255,.50);border-radius:999px}
.ctrl-left{display:flex;align-items:center;gap:1px;flex-shrink:0}
.ctrl-mid{flex:1;min-width:0;padding:0 4px}
.ctrl-right{display:flex;align-items:center;gap:2px;flex-shrink:0}
.ctrl-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);padding:3px;transition:color .2s;-webkit-tap-highlight-color:transparent}
.ctrl-btn:active{opacity:.7}
.ctrl-btn.play-btn{width:28px;height:28px;background:var(--pink-deep);border-radius:50%;color:#fff;padding:0;box-shadow:0 2px 8px rgba(224,112,144,.35)}
.ctrl-btn svg{width:17px;height:17px;fill:currentColor}
.ctrl-btn.play-btn svg{width:12px;height:12px;fill:#fff;margin-left:1px}
.ctrl-btn.fav-circle{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(224,112,144,.45);padding:0;color:var(--pink-deep)}
.ctrl-btn.fav-circle svg{width:13px;height:13px}
.progress-bar{width:100%;height:3px;background:rgba(224,112,144,.18);border-radius:2px;position:relative;cursor:pointer}
.progress-fill{height:100%;background:var(--pink-deep);border-radius:2px;transition:width .5s linear}
.progress-dot{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:8px;height:8px;background:var(--pink-deep);border-radius:50%}
/* 播放tab：心动/推荐/歌单 */
.play-tab-bar{display:flex;margin:10px 16px 0;background:rgba(255,255,255,.2);border-radius:999px;padding:3px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.3)}
.play-tab{flex:1;text-align:center;padding:7px 0;font-size:13px;color:var(--text2);border-radius:999px;cursor:pointer;transition:.2s;font-weight:500}
.play-tab.active{background:rgba(255,255,255,.78);color:var(--pink-deep);font-weight:600;box-shadow:0 2px 8px rgba(224,112,144,.15)}
/* 歌单列表 */
.song-list{list-style:none;padding:0 12px 80px}
.song-item{display:flex;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer;gap:10px;transition:background .15s}
.song-item:active{background:rgba(242,168,192,.1)}
.song-item.playing .si-name{color:var(--pink-deep);font-weight:600}
.si-cover{width:42px;height:42px;border-radius:6px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,var(--pink),var(--pink-deep));display:flex;align-items:center;justify-content:center;font-size:16px}
.si-cover img{width:100%;height:100%;object-fit:cover}
.si-info{flex:1;min-width:0}
.si-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-sub{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-play-icon{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text2)}
.si-play-icon svg{width:12px;height:12px;fill:currentColor;margin-left:2px}
/* ====== 搜索页 ====== */
.search-page{padding:16px}
.search-bar{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:0 16px;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;border:none;outline:none;font-size:15px;padding:12px 0;background:none;color:var(--text)}
.search-bar input::placeholder{color:var(--text2)}
.search-btn{background:none;border:none;cursor:pointer;font-size:18px;color:var(--pink-deep);padding:4px}
.result-list{list-style:none}
.result-item{display:flex;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;gap:10px;transition:background .15s}
.result-item:active{background:rgba(242,168,192,.1)}
.ri-cover{width:44px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,var(--pink),var(--pink-deep));display:flex;align-items:center;justify-content:center;font-size:20px}
.ri-cover img{width:100%;height:100%;object-fit:cover}
.ri-info{flex:1;min-width:0}
.ri-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-sub{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-add{background:none;border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--pink-deep);cursor:pointer}
/* ====== 我的页 ====== */
.my-page{padding:0;overflow-y:auto}
.my-header{background:linear-gradient(180deg,rgba(242,168,192,.45) 0%,transparent 100%);padding:28px 20px 20px;text-align:center}
.my-avatar-img{width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 16px rgba(224,112,144,.3);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pink),var(--pink-deep));font-size:36px}
.my-avatar-img img{width:100%;height:100%;object-fit:cover}
.my-nickname{font-size:20px;font-weight:700;margin-bottom:4px}
.my-badges{font-size:12px;color:var(--text2);margin-bottom:14px}
.my-stats{display:flex;justify-content:center}
.stat-item{flex:0 0 80px;text-align:center;padding:0 4px}
.stat-num{font-size:17px;font-weight:700}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px}
/* 快捷按钮 */
.my-quick{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:14px 12px;background:var(--card);margin-bottom:10px}
.q-btn{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:4px 0}
.q-icon{width:44px;height:44px;border-radius:14px;background:#fdf0f5;display:flex;align-items:center;justify-content:center;font-size:20px}
.q-label{font-size:11px;color:var(--text2)}
/* 我的内容tabs */
.my-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;margin-bottom:0}
.my-tab{flex:1;max-width:80px;text-align:center;padding:12px 0;font-size:14px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.my-tab.active{color:var(--pink-deep);border-bottom-color:var(--pink-deep);font-weight:600}
/* 歌单 */
.my-playlist-area{background:var(--card);padding-bottom:80px}
.my-fav-row{display:flex;align-items:center;padding:14px 16px;gap:12px;cursor:pointer;border-bottom:1px solid var(--border)}
.my-fav-cover{width:50px;height:50px;border-radius:8px;background:linear-gradient(135deg,#ff6b8a,#e0407a);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.my-fav-info{flex:1}
.my-fav-name{font-size:15px;font-weight:600}
.my-fav-count{font-size:12px;color:var(--text2);margin-top:2px}
.my-fav-mode{font-size:11px;color:var(--pink-deep);white-space:nowrap}
.my-pl-item{display:flex;align-items:center;padding:12px 16px;gap:12px;cursor:pointer;transition:.15s;border-bottom:1px solid var(--border)}
.my-pl-item:active{background:var(--bg)}
.my-pl-cover{width:50px;height:50px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,var(--pink),var(--pink-deep));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.my-pl-cover img{width:100%;height:100%;object-fit:cover}
.my-pl-info{flex:1;min-width:0}
.my-pl-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-pl-desc{font-size:12px;color:var(--text2);margin-top:2px}
.my-new-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.my-new-icon{width:50px;height:50px;border-radius:8px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text2);flex-shrink:0}
.login-prompt{padding:40px 20px;text-align:center}
.login-prompt p{color:var(--text2);font-size:14px;margin-bottom:16px}
.qr-wrap{margin:16px auto;width:180px;height:180px;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.qr-wrap img{width:100%;height:100%}
.qr-tip{font-size:12px;color:var(--text2);margin-top:8px}
.login-btn{background:var(--pink-deep);color:#fff;border:none;border-radius:24px;padding:12px 32px;font-size:15px;cursor:pointer;box-shadow:var(--shadow)}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.playlist-card{background:var(--card);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 8px rgba(224,112,144,.08);transition:transform .15s}
.playlist-card:active{transform:scale(0.98)}
.pl-cover{width:52px;height:52px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,var(--pink),var(--pink-deep));display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pl-cover img{width:100%;height:100%;object-fit:cover}
.pl-info{flex:1}
.pl-name{font-size:14px;font-weight:500}
.pl-count{font-size:12px;color:var(--text2);margin-top:3px}
/* ====== 登录弹窗 ====== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.hidden{display:none}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:500px}
.modal-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:8px}
.modal-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:16px}
.modal-qr{width:200px;height:200px;margin:0 auto 12px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
.modal-qr img{width:100%;height:100%}
.modal-qr-tip{text-align:center;font-size:12px;color:var(--text2);margin-bottom:20px}
.modal-close{width:100%;background:none;border:1px solid var(--border);border-radius:24px;padding:12px;font-size:15px;color:var(--text2);cursor:pointer}
/* ====== 加载 ====== */
.loading{text-align:center;padding:32px;color:var(--text2);font-size:14px}
.spin{display:inline-block;animation:spin 1s linear infinite;font-size:20px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ====== 空状态 ====== */
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:12px}
</style>
</head>
<body class="play-active">

<!-- 顶部导航 -->
<div class="nav">
  <div class="nav-inner">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title" id="navTitle">🎵 音乐</div>
    <button class="nav-login-btn" id="loginBtn" onclick="openLogin()">登录</button>
  </div>
</div>

<!-- 主内容 -->
<div class="main">

  <!-- 播放页 -->
  <div class="page active" id="page-play">
    <!-- 顶部小胶囊：返回/播放模式/设置 -->
    <div class="top-nav-capsule">
      <button class="tnc-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
      </button>
      <!-- 中间：随机/循环切换 -->
      <div class="tnc-mid" onclick="togglePlayMode()">
        <svg id="tncModeIcon" viewBox="0 0 24 24"><path id="tncModePath" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v5z"/></svg>
      </div>
      <!-- 右：空心设置图标 -->
      <button class="tnc-btn" onclick="showToast('设置敬请期待')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
    <!-- 封面轮播 - 5卡叠叠拍立得 -->
    <div class="cover-carousel" id="carousel">
      <div class="covers-track" id="coversTrack">
        <div class="cover-item far-prev" id="coverFarPrev">
          <div class="cover-wrap"><div class="cover-inner"><div class="cover-placeholder">🎵</div></div></div>
        </div>
        <div class="cover-item prev" id="coverPrev">
          <div class="cover-wrap"><div class="cover-inner"><div class="cover-placeholder">🎵</div></div></div>
        </div>
        <div class="cover-item center" id="coverCur">
          <div class="cover-wrap">
            <div class="cover-inner"><div class="cover-placeholder">🎶</div></div>
            <div class="cover-title">
              <div class="song-name" id="songName">未在播放</div>
              <div class="song-artist" id="songArtist">-</div>
            </div>
          </div>
        </div>
        <div class="cover-item next" id="coverNext">
          <div class="cover-wrap"><div class="cover-inner"><div class="cover-placeholder">🎵</div></div></div>
        </div>
        <div class="cover-item far-next" id="coverFarNext">
          <div class="cover-wrap"><div class="cover-inner"><div class="cover-placeholder">🎵</div></div></div>
        </div>
      </div>
    </div>
    <!-- 歌词 3行 -->
    <div class="lyrics" id="lyrics">
      <div class="lyric-line" id="lyric-prev">　</div>
      <div class="lyric-line active" id="lyric-cur">打开歌单，开始听歌</div>
      <div class="lyric-line" id="lyric-next">　</div>
    </div>
    <!-- 控制胶囊（图二风格：薄，无时间，爱心带圈） -->
    <div class="controls-capsule">
      <div class="ctrl-left">
        <button class="ctrl-btn" onclick="prevSong()">

<!-- 音频 -->
<audio id="audio" preload="none"></audio>

<script>
const API = '/api/netease?key=xiaomao520';
const audio = document.getElementById('audio');

// ====== Cookie工具 ======
// 把 Set-Cookie 格式（含 Max-Age/Path 等）解析成纯 Cookie 请求头格式
function parseCookieForHeader(setCookieStr) {
  if (!setCookieStr) return '';
  // 兼容两种格式：
  // 1. Set-Cookie头（逗号分隔）："MUSIC_U=xxx; Max-Age=..., NMTID=yyy; ..."
  // 2. NeteaseCloudMusicApi body.cookie（分号拼接）："MUSIC_U=xxx; Max-Age=...;NMTID=yyy; ..."
  // 方案：按所有 ; 和 , 分割，过滤掉 cookie 属性名，保留所有 name=value 对
  const ATTRS = /^(max-age|path|domain|expires|samesite|secure|httponly)(\s*=|$)/i;
  return setCookieStr
    .split(/[;,]+/)
    .map(p => p.trim())
    .filter(p => p && !ATTRS.test(p))
    .join('; ');
}

// ====== 状态 ======
let playlist = JSON.parse(localStorage.getItem('nease_playlist') || '[]');
let curIdx = parseInt(localStorage.getItem('nease_curIdx') || '0');
let cookie = localStorage.getItem('nease_cookie') || '';
let userInfo = JSON.parse(localStorage.getItem('nease_user') || 'null');
let isPlaying = false;
let playMode = 0; // 0=顺序 1=单曲 2=随机
let lyricLines = [];
let lyricTimers = [];
let qrTimer = null;

// ====== Tab切换 ======
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  // 播放页隐藏顶部导航栏
  document.body.classList.toggle('play-active', tab === 'play');
  if (tab === 'my') renderMyPage();
}

// ====== API请求 ======
// NeteaseCloudMusicApi读的是 query.cookie（URL参数），不是HTTP Cookie头
// 所以登录后的所有请求都把cookie放进URL参数里传
async function api(path, params = {}) {
  const allParams = { ...params };
  if (cookie) allParams.cookie = cookie; // 关键：cookie作为URL参数
  const qs = new URLSearchParams(allParams).toString();
  const url = `${API}&path=${encodeURIComponent(path)}${qs ? '&' + qs : ''}`;
  const res = await fetch(url);
  return res.json();
}

// ====== 搜索 ======
let searchResults = []; // 全局缓存，避免onclick里JSON字符串特殊字符问题

async function doSearch() {
  const kw = document.getElementById('searchInput').value.trim();
  if (!kw) return;
  const el = document.getElementById('resultList');
  el.innerHTML = '<div class="loading"><span class="spin">⏳</span> 搜索中…</div>';
  try {
    const d = await api('/cloudsearch', { keywords: kw, limit: 20 });
    const songs = d.result?.songs || [];
    if (!songs.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">😶</div><div>没找到结果</div></div>'; return; }
    // 存到全局数组，避免onclick里JSON特殊字符导致失效
    searchResults = songs.map(s => ({
      id: s.id,
      name: s.name,
      artist: (s.ar || s.artists || []).map(a => a.name).join('/'),
      cover: s.al?.picUrl || s.album?.picUrl || ''
    }));
    el.innerHTML = searchResults.map((s, i) => {
      const cover = s.cover ? s.cover + '?param=300y300' : '';
      return `<li class="result-item" onclick="addAndPlay(searchResults[${i}])">
        <div class="ri-cover">${cover ? `<img src="${cover}">` : '🎵'}</div>
        <div class="ri-info"><div class="ri-name">${s.name}</div><div class="ri-sub">${s.artist}</div></div>
        <button class="ri-add" onclick="event.stopPropagation();addToPlaylist(searchResults[${i}])">+加入</button>
      </li>`;
    }).join('');
  } catch(e) { el.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div>搜索失败</div></div>'; }
}

// ====== 播放 ======
async function addAndPlay(song) {
  addToPlaylist(song, false);
  curIdx = playlist.findIndex(s => s.id === song.id);
  await playCur();
  switchTab('play');
}

function addToPlaylist(song, notify = true) {
  if (!playlist.find(s => s.id === song.id)) {
    playlist.push(song);
    savePlaylist();
    renderPlaylist();
    if (notify) showToast('已添加到播放列表');
  }
}

async function playCur() {
  if (!playlist.length) return;
  const song = playlist[curIdx];
  updateSongUI(song);
  try {
    const d = await api('/song/url', { id: song.id, br: 128000 });
    const url = d.data?.[0]?.url;
    if (!url) { showToast('此歌曲暂无版权'); nextSong(); return; }
    audio.src = url;
    audio.play();
    isPlaying = true;
    setPlayIcon(true);
    // 加载歌词
    loadLyric(song.id);
    localStorage.setItem('nease_curIdx', curIdx);
  } catch(e) { showToast('播放失败'); }
}

function updateSongUI(song) {
  document.getElementById('songName').textContent = song.name || '-';
  document.getElementById('songArtist').textContent = song.artist || '-';
  const mkInner = (url, size) => url
    ? `<img src="${url}?param=${size||'200y200'}">`
    : `<div class="cover-placeholder">🎵</div>`;
  const setInner = (id, url, size) => {
    const el = document.querySelector('#' + id + ' .cover-inner');
    if (el) el.innerHTML = mkInner(url, size);
  };
  const len = playlist.length;
  const at = i => playlist[(i + len) % len];
  setInner('coverCur', song.cover, '300y300');
  setInner('coverPrev',    len > 0 ? at(curIdx-1)?.cover : null);
  setInner('coverNext',    len > 1 ? at(curIdx+1)?.cover : null);
  setInner('coverFarPrev', len > 1 ? at(curIdx-2)?.cover : null);
  setInner('coverFarNext', len > 1 ? at(curIdx+2)?.cover : null);
  document.title = (song.name || '音乐') + ' - 小克&小猫';
  renderPlaylist();
}

async function loadLyric(id) {
  document.getElementById('lyric-prev').textContent = '　';
  document.getElementById('lyric-cur').textContent  = '🎵';
  document.getElementById('lyric-next').textContent = '　';
  try {
    const d = await api('/lyric', { id });
    const raw = d.lrc?.lyric || '';
    lyricLines = parseLyric(raw);
    if (!lyricLines.length) {
      document.getElementById('lyric-cur').textContent = '暂无歌词';
    }
  } catch(e) {}
}

function parseLyric(raw) {
  return raw.split('\n').map(line => {
    const m = line.match(/\[(\d+):(\d+)\.(\d+)\](.*)/);
    if (!m) return null;
    const t = parseInt(m[1]) * 60 + parseFloat(m[2] + '.' + m[3]);
    return { time: t, text: m[4].trim() };
  }).filter(Boolean);
}

// 进度更新
audio.addEventListener('timeupdate', () => {
  const cur = audio.currentTime, dur = audio.duration || 1;
  const pct = (cur / dur * 100).toFixed(1);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressFill').nextElementSibling.style.left = pct + '%';
  const ctEl = document.getElementById('curTime');
  const ttEl = document.getElementById('totalTime');
  if (ctEl) ctEl.textContent = fmt(cur);
  if (ttEl) ttEl.textContent = fmt(dur);
  // 歌词同步（3行）
  if (lyricLines.length) {
    let active = 0;
    for (let i = 0; i < lyricLines.length; i++) {
      if (lyricLines[i].time <= cur) active = i;
    }
    document.getElementById('lyric-prev').textContent = lyricLines[active-1]?.text || '　';
    document.getElementById('lyric-cur').textContent  = lyricLines[active]?.text  || '　';
    document.getElementById('lyric-next').textContent = lyricLines[active+1]?.text || '　';
  }
});
audio.addEventListener('ended', () => { nextSong(); });

function fmt(s) {
  s = Math.floor(s) || 0;
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function seekTo(e) {
  const bar = document.getElementById('progressBar');
  const pct = e.offsetX / bar.offsetWidth;
  audio.currentTime = pct * (audio.duration || 0);
}

function togglePlay() {
  if (audio.paused) { if (!audio.src) playCur(); else audio.play(); isPlaying=true; setPlayIcon(true); }
  else { audio.pause(); isPlaying=false; setPlayIcon(false); }
}
function setPlayIcon(playing) {
  document.getElementById('playIcon').innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}
function prevSong() {
  curIdx = (curIdx - 1 + playlist.length) % playlist.length;
  playCur();
}
function nextSong() {
  if (playMode === 1) curIdx = Math.floor(Math.random() * playlist.length);
  else curIdx = (curIdx + 1) % playlist.length;
  playCur();
}
// 播放模式：0=循环播放(🔁) 1=随机播放(🔀)
const LOOP_PATH = 'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v5z';
const SHUFFLE_PATH = 'M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z';
function updateModeIcon() {
  const p = document.getElementById('tncModePath');
  if (p) p.setAttribute('d', playMode === 0 ? LOOP_PATH : SHUFFLE_PATH);
}
function togglePlayMode() {
  playMode = playMode === 0 ? 1 : 0;
  updateModeIcon();
  showToast(playMode === 0 ? '循环播放' : '随机播放');
}
function toggleMode() { togglePlayMode(); } // 兼容旧调用
function toggleFav() {
  const icon = document.getElementById('favIcon');
  const isFav = icon.querySelector('path').getAttribute('d').includes('M12');
  if (isFav) {
    icon.innerHTML = '<path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/>';
    showToast('取消收藏');
  } else {
    icon.innerHTML = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';
    showToast('已收藏');
  }
}

// 封面滑动切歌
let touchStartX = 0;
document.getElementById('carousel').addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
document.getElementById('carousel').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 50) prevSong();
  else if (dx < -50) nextSong();
});

// 播放列表（内部队列，不再直接渲染到UI，只更新tab列表的播放状态）
function renderPlaylist() {
  if (window._tabSongs) renderTabSongs(document.getElementById('playTabList'));
}
function playSongAt(idx) { curIdx = idx; playCur(); }
function removeSong(idx) { playlist.splice(idx,1); if(curIdx>=playlist.length) curIdx=Math.max(0,playlist.length-1); savePlaylist(); }
function clearPlaylist() { playlist=[]; curIdx=0; audio.pause(); audio.src=''; isPlaying=false; setPlayIcon(false); savePlaylist(); document.getElementById('songName').textContent='未在播放'; document.getElementById('songArtist').textContent='-'; document.querySelector('#coverCur .cover-inner').innerHTML='<div class="cover-placeholder">🎶</div>'; }
const _tabOrder = ['heart','recommend','koko'];
const _tabNames = {heart:'心动',recommend:'推荐',koko:'歌单'};
function cyclePlayTab() {
  const i = _tabOrder.indexOf(currentPlayTab);
  const next = _tabOrder[(i+1) % _tabOrder.length];
  switchPlayTab(next);
}
function updateTncTitle() { /* no-op: top capsule now shows play mode icon */ }
function savePlaylist() { localStorage.setItem('nease_playlist', JSON.stringify(playlist)); }

// ====== 播放 tab：心动/推荐/歌单 ======
let currentPlayTab = 'heart';

async function switchPlayTab(tab) {
  currentPlayTab = tab;
  document.querySelectorAll('.play-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('ptab-' + tab).classList.add('active');
  updateTncTitle();
  const el = document.getElementById('playTabList');
  el.innerHTML = '<li style="padding:20px;text-align:center;color:var(--text2);list-style:none"><span class="spin">⏳</span></li>';
  try {
    let songs = [];
    if (tab === 'heart') {
      if (!cookie) { el.innerHTML = '<li style="padding:20px;text-align:center;color:var(--text2);font-size:13px;list-style:none">登录后查看</li>'; return; }
      if (!userInfo?.userId) await fetchUserInfo();
      const d = await api('/user/playlist', { uid: userInfo.userId, limit: 1 });
      const favId = d.playlist?.[0]?.id;
      if (!favId) { el.innerHTML = '<li style="padding:20px;text-align:center;color:var(--text2);list-style:none">找不到歌单</li>'; return; }
      const d2 = await api('/playlist/track/all', { id: favId, limit: 100 });
      songs = (d2.songs||[]).map(s => ({ id:s.id, name:s.name, artist:(s.ar||[]).map(a=>a.name).join('/'), cover:s.al?.picUrl||'' }));
    } else if (tab === 'recommend') {
      if (!cookie) { el.innerHTML = '<li style="padding:20px;text-align:center;color:var(--text2);font-size:13px;list-style:none">登录后查看每日推荐</li>'; return; }
      const d = await api('/recommend/songs');
      songs = (d.data?.dailySongs||[]).map(s => ({ id:s.id, name:s.name, artist:(s.ar||s.artists||[]).map(a=>a.name).join('/'), cover:s.al?.picUrl||s.album?.picUrl||'' }));
    } else if (tab === 'koko') {
      if (!cookie) { el.innerHTML = '<li style="padding:20px;text-align:center;color:var(--text2);font-size:13px;list-style:none">登录后查看</li>'; return; }
      if (!userInfo?.userId) await fetchUserInfo();
      if (!window._myPlaylists) {
        const d = await api('/user/playlist', { uid: userInfo.userId, limit: 30 });
        window._myPlaylists = d.playlist || [];
      }
      const kokoPl = window._myPlaylists.find(p => p.name.toLowerCase().includes('koko'));
      if (!kokoPl) { el.innerHTML = '<li style="padding:20px;text-align:center;color:var(--text2);font-size:13px;list-style:none">找不到koko歌单</li>'; return; }
      const d = await api('/playlist/track/all', { id: kokoPl.id, limit: 100 });
      songs = (d.songs||[]).map(s => ({ id:s.id, name:s.name, artist:(s.ar||[]).map(a=>a.name).join('/'), cover:s.al?.picUrl||'' }));
    }
    window._tabSongs = songs;
    renderTabSongs(el);
  } catch(e) {
    el.innerHTML = '<li style="padding:20px;text-align:center;color:var(--text2);list-style:none">加载失败，请重试</li>';
  }
}

function renderTabSongs(el) {
  const songs = window._tabSongs || [];
  if (!songs.length) { el.innerHTML = '<li style="padding:20px;text-align:center;color:var(--text2);list-style:none">暂无歌曲</li>'; return; }
  el.innerHTML = songs.map((s, i) => {
    const isPlay = playlist.length > 0 && playlist[curIdx]?.id === s.id;
    return `<li class="song-item ${isPlay?'playing':''}" onclick="playTabSong(${i})">
      <div class="si-cover">${s.cover ? `<img src="${s.cover}?param=200y200">` : '🎵'}</div>
      <div class="si-info"><div class="si-name">${s.name}</div><div class="si-sub">${s.artist||''}</div></div>
      <div class="si-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </li>`;
  }).join('');
}

function playTabSong(idx) {
  if (!window._tabSongs || !window._tabSongs.length) return;
  playlist = [...window._tabSongs];
  curIdx = idx;
  savePlaylist();
  playCur();
  renderTabSongs(document.getElementById('playTabList'));
}

// ====== 登录 ======
async function openLogin() {
  document.getElementById('loginModal').classList.remove('hidden');
  document.getElementById('qrTip').textContent = '生成二维码中…';
  document.getElementById('qrBox').innerHTML = '<div class="spin">⏳</div>';
  try {
    // 1. 获取key（带设备信息，让网易云授权管理里显示 koko-music）
    const k = await api('/login/qr/key', { type: 1 });
    const unikey = k.data?.unikey;
    if (!unikey) { document.getElementById('qrTip').textContent = '获取二维码失败'; return; }
    // 2. 生成二维码
    const q = await api('/login/qr/create', { key: unikey, qrimg: true });
    const qrImg = q.data?.qrimg;
    document.getElementById('qrBox').innerHTML = qrImg ? `<img src="${qrImg}" style="width:100%;height:100%">` : '<div class="spin">⏳</div>';
    document.getElementById('qrTip').textContent = '用手机网易云音乐扫码登录';
    // 3. 轮询状态（1秒一次）
    // qrSession：把NMTID以 cookie= URL参数形式传给netease-api（不是Cookie头！）
    // 因为NeteaseCloudMusicApi读的是 query.cookie，不是HTTP Cookie头
    let qrSession = '';
    if (qrTimer) clearInterval(qrTimer);
    qrTimer = setInterval(async () => {
      try {
        // cookie作为URL参数传入（netease-api的createOption读query.cookie）
        const cookieParam = qrSession ? `&cookie=${encodeURIComponent(qrSession)}` : '';
        const checkUrl = `${API}&path=${encodeURIComponent('/login/qr/check')}&key=${encodeURIComponent(unikey)}${cookieParam}`;
        const res = await fetch(checkUrl);
        const s = await res.json();
        // 调试：显示当前状态
        document.getElementById('qrTip').textContent = `状态 ${s.code} | sess:${qrSession.slice(0,15)||'空'} | ck:${(s.cookie||'').slice(0,15)}`;
        // 每次都更新qrSession（801/802都要存，803前需要最新的cookie）
        // s.cookie（响应体）优先于 s._cookie（Set-Cookie头，可能不完整）
        const rawSess = s.cookie || s._cookie || '';
        if (rawSess) qrSession = parseCookieForHeader(rawSess);
        if (s.code === 802) {
          document.getElementById('qrTip').textContent = `✅ 扫码成功，网易云确认中… sess:${qrSession.slice(0,20)}`;
        }
        if (s.code === 803) {
          clearInterval(qrTimer);
          // 登录成功：从响应体取 cookie，解析成纯 name=value 格式（去掉 Max-Age/Path 等）
          // s.cookie（body）优先，包含完整的 MUSIC_U + NMTID + __csrf
          const rawCookie = s.cookie || s._cookie || '';
          cookie = parseCookieForHeader(rawCookie) || qrSession;
          document.getElementById('qrTip').textContent = `803✓ raw:${rawCookie.slice(0,30)} → parsed:${cookie.slice(0,30)}`;
          if (cookie) {
            localStorage.setItem('nease_cookie', cookie);
            await fetchUserInfo();
            closeLogin();
            showToast('🎉 登录成功！');
            renderMyPage();
          } else {
            // cookie为空时尝试直接拉用户信息
            await fetchUserInfo();
            if (userInfo) { closeLogin(); showToast('🎉 登录成功！'); renderMyPage(); }
            else { document.getElementById('qrTip').textContent = '登录成功但获取信息失败，请重试'; }
          }
        } else if (s.code === 800) {
          document.getElementById('qrTip').textContent = '二维码已过期，点取消后重新登录';
          clearInterval(qrTimer);
        } else if (s.code === 802) {
          document.getElementById('qrTip').textContent = '✅ 扫码成功，请在网易云App确认…';
        }
      } catch(e) {}
    }, 1000);
  } catch(e) { document.getElementById('qrTip').textContent = '获取失败，请稍后重试'; }
}
function closeLogin() {
  document.getElementById('loginModal').classList.add('hidden');
  if (qrTimer) clearInterval(qrTimer);
}

async function fetchUserInfo() {
  try {
    const d = await api('/user/account');
    userInfo = d.profile;
    localStorage.setItem('nease_user', JSON.stringify(userInfo));
    document.getElementById('loginBtn').textContent = userInfo?.nickname || '已登录';
  } catch(e) {}
}

// ====== 我的页 ======
async function renderMyPage() {
  const el = document.getElementById('myPageContent');
  if (!cookie) {
    el.innerHTML = `
      <div class="login-prompt">
        <div style="font-size:64px;margin-bottom:16px">🎵</div>
        <p>登录网易云账号，同步你的歌单</p>
        <button class="login-btn" onclick="openLogin()">扫码登录</button>
      </div>`;
    return;
  }
  // cookie有了但userInfo没有，先拉一次
  if (!userInfo) {
    el.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text2)">⏳ 加载中…</div>`;
    await fetchUserInfo();
    if (!userInfo) {
      cookie = ''; localStorage.removeItem('nease_cookie');
      el.innerHTML = `
        <div class="login-prompt">
          <div style="font-size:64px;margin-bottom:16px">🎵</div>
          <p>登录已过期，请重新登录</p>
          <button class="login-btn" onclick="openLogin()">扫码登录</button>
        </div>`;
      return;
    }
  }
  const avatarHtml = userInfo.avatarUrl ? `<img src="${userInfo.avatarUrl}">` : '🎵';
  el.innerHTML = `
    <div class="my-header">
      <div class="my-avatar-img">${avatarHtml}</div>
      <div class="my-nickname">${userInfo.nickname || ''}</div>
      <div class="my-badges" id="myBadges">0枚徽章</div>
      <div class="my-stats">
        <div class="stat-item"><div class="stat-num" id="statFollows">-</div><div class="stat-label">关注</div></div>
        <div class="stat-item"><div class="stat-num" id="statFolloweds">-</div><div class="stat-label">粉丝</div></div>
        <div class="stat-item"><div class="stat-num" id="statLevel">-</div><div class="stat-label">等级</div></div>
        <div class="stat-item"><div class="stat-num" id="statListen">-</div><div class="stat-label">小时</div></div>
      </div>
    </div>
    <div class="my-quick">
      <div class="q-btn"><div class="q-icon">🕐</div><div class="q-label">最近</div></div>
      <div class="q-btn"><div class="q-icon">📱</div><div class="q-label">本地</div></div>
      <div class="q-btn"><div class="q-icon">👑</div><div class="q-label" style="color:var(--pink-deep)">VIP会员</div></div>
      <div class="q-btn"><div class="q-icon">✨</div><div class="q-label">装扮</div></div>
      <div class="q-btn"><div class="q-icon" style="font-size:16px">•••</div><div class="q-label">更多</div></div>
    </div>
    <div class="my-tabs">
      <div class="my-tab active">音乐</div>
      <div class="my-tab">播客</div>
      <div class="my-tab">笔记</div>
    </div>
    <div class="my-playlist-area">
      <div id="myPlaylists"><div style="padding:24px;text-align:center;color:var(--text2)">⏳ 加载歌单…</div></div>
    </div>`;

  // 异步加载用户详情（等级/关注/粉丝/听歌时长）
  try {
    const d2 = await api('/user/detail', { uid: userInfo.userId });
    if (d2.profile) {
      document.getElementById('statFollows').textContent = d2.profile.follows ?? 0;
      document.getElementById('statFolloweds').textContent = d2.profile.followeds ?? 0;
      document.getElementById('statLevel').textContent = 'Lv.' + (d2.profile.level || 1);
      const hrs = Math.round((d2.listenSongs || 0) * 3 / 60);
      document.getElementById('statListen').textContent = hrs + '小时';
    }
  } catch(e) {}

  // 加载歌单
  try {
    const d = await api('/user/playlist', { uid: userInfo.userId, limit: 30 });
    const lists = d.playlist || [];
    if (!lists.length) {
      document.getElementById('myPlaylists').innerHTML = '<div style="padding:24px;text-align:center;color:var(--text2)">暂无歌单</div>';
      return;
    }
    const favPl = lists[0];
    const otherPls = lists.slice(1);
    // 用全局数组存歌单信息避免onclick里特殊字符问题
    window._myPlaylists = lists;
    document.getElementById('myPlaylists').innerHTML = `
      <div class="my-fav-row" onclick="loadPlaylist(window._myPlaylists[0].id, window._myPlaylists[0].name)">
        <div class="my-fav-cover">❤️</div>
        <div class="my-fav-info">
          <div class="my-fav-name">${favPl.name}</div>
          <div class="my-fav-count">${favPl.trackCount} 首</div>
        </div>
        <div class="my-fav-mode">♡ 心动模式</div>
      </div>
      ${otherPls.map((pl, i) => `
      <div class="my-pl-item" onclick="loadPlaylist(window._myPlaylists[${i+1}].id, window._myPlaylists[${i+1}].name)">
        <div class="my-pl-cover">${pl.coverImgUrl ? `<img src="${pl.coverImgUrl}?param=200y200">` : '🎵'}</div>
        <div class="my-pl-info">
          <div class="my-pl-name">${pl.name}</div>
          <div class="my-pl-desc">歌单 · ${pl.trackCount}首 · ${pl.creator?.nickname || ''}</div>
        </div>
      </div>`).join('')}
      <div class="my-new-btn">
        <div class="my-new-icon">＋</div>
        <div style="font-size:14px;color:var(--text2)">新建歌单</div>
      </div>`;
  } catch(e) {
    document.getElementById('myPlaylists').innerHTML = '<div style="padding:24px;text-align:center;color:var(--text2)">加载失败</div>';
  }
}

async function loadPlaylist(id, name) {
  showToast('加载歌单: ' + name);
  try {
    const d = await api('/playlist/track/all', { id, limit: 50 });
    const songs = d.songs || [];
    songs.forEach(s => {
      const song = { id: s.id, name: s.name, artist: (s.ar||[]).map(a=>a.name).join('/'), cover: s.al?.picUrl||'' };
      if (!playlist.find(p => p.id === song.id)) playlist.push(song);
    });
    savePlaylist();
    renderPlaylist();
    switchTab('play');
    showToast(`已添加 ${songs.length} 首`);
  } catch(e) { showToast('加载失败'); }
}

// ====== Toast ======
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;border-radius:20px;padding:8px 20px;font-size:13px;z-index:300;transition:opacity .3s'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity='0', 2000);
}

// ====== 初始化 ======
window.addEventListener('DOMContentLoaded', () => {
  updateModeIcon(); // 初始化顶部胶囊模式图标
  if (cookie && userInfo) {
    document.getElementById('loginBtn').textContent = userInfo.nickname || '已登录';
    switchPlayTab('heart');
  }
});
</script>

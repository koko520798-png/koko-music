<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#faf0f4">
<title>音乐 · 小克&小猫</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#f2a8c0;--pink-deep:#e07090;--bg:#faf0f4;--card:#fff;
  --text:#333;--text2:#888;--border:rgba(240,160,190,0.25);
  --active:#e07090;--shadow:0 4px 20px rgba(224,112,144,0.15);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
/* ====== 顶部小胶囊（全局固定，替代原来的顶部导航栏） ====== */
.top-nav-capsule{
  position:fixed;top:calc(env(safe-area-inset-top,0) + 8px);left:72px;right:72px;
  z-index:100;padding:5px 10px;gap:6px;
  display:flex;align-items:center;
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:.5px solid rgba(255,255,255,.60);border-radius:999px;
  box-shadow:0 2px 12px rgba(224,112,144,.12)
}
/* ====== 底部tab ====== */
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:transparent;border-top:none;
  padding:0 0 env(safe-area-inset-bottom,0);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0;cursor:pointer;font-size:14px;font-weight:600;color:var(--text2);gap:3px;transition:color .2s;text-shadow:0 1px 4px rgba(255,255,255,.6)}
.tab.active{color:var(--active)}
/* ====== 主内容：固定在屏幕内，不让页面整体滚动 ====== */
.main{
  position:fixed;
  top:calc(env(safe-area-inset-top,0) + 54px);
  bottom:calc(env(safe-area-inset-bottom,0) + 45px);
  left:0;right:0;
  overflow:hidden;
}
.page{display:none;height:100%}
.page.active{display:block;height:100%}
/* 播放页：flex 列，封面/歌词/控制固定，歌单可滚动 */
#page-play.active{display:flex;flex-direction:column}
/* 搜索页、我的页：自身滚动 */
#page-search,#page-my{overflow-y:auto}
/* ====== 播放页 ====== */
.tnc-btn{background:none;border:none;cursor:pointer;color:var(--text2);padding:3px;display:flex;align-items:center;-webkit-tap-highlight-color:transparent}
.tnc-btn svg{width:17px;height:17px;fill:currentColor}
/* 左边返回按钮大一点 */
.tnc-back svg{width:22px;height:22px}
.tnc-mid{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2)}
.tnc-mid svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* 设置按钮专属：描边gear */
.tnc-settings svg{fill:none !important;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* koko歌单按钮：描边圆圈➕ */
.ctrl-btn.koko-btn svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* 5卡叠叠拍立得轮播（绝对定位叠加） */
.cover-carousel{position:relative;height:230px;padding:10px 0 0;overflow:visible;touch-action:pan-y;user-select:none;flex-shrink:0}
.covers-track{position:relative;width:100%;height:100%}
.cover-item{position:absolute;top:50%;left:50%;transform-origin:center center;transition:all .4s cubic-bezier(.25,.46,.45,.94);cursor:pointer}
.cover-wrap{display:flex;flex-direction:column;align-items:center;overflow:hidden;background:rgba(252,232,237,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cover-inner{overflow:hidden;flex-shrink:0}
.cover-inner img{width:100%;height:100%;object-fit:cover;display:block}
.cover-placeholder{width:100%;height:100%;background:rgba(242,168,192,.35);display:flex;align-items:center;justify-content:center;font-size:28px}
/* 歌名在中间卡片底部白区 */
.cover-title{width:100%;padding:5px 8px 0;text-align:center;display:none;margin-top:2px}
.cover-item.center .cover-title{display:block}
.song-name{font-size:12px;font-weight:700;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
/* 各档位 */
/* far-prev/far-next：整体不透明(opacity在cover-item上去掉)，用cover-inner虚化图片，cover-wrap不透明背景遮挡后面的卡片 */
.cover-item.far-prev{transform:translate(-50%,-50%) translateX(-130px) scale(.52);z-index:1}
.cover-item.far-next{transform:translate(-50%,-50%) translateX(130px) scale(.52);z-index:1}
.cover-item.far-prev .cover-wrap,.cover-item.far-next .cover-wrap{width:150px;height:auto;padding:7px 7px 36px;border-radius:20px;box-shadow:0 3px 12px rgba(0,0,0,.12);background:rgb(252,232,237)}
.cover-item.far-prev .cover-inner,.cover-item.far-next .cover-inner{width:136px;height:136px;border-radius:16px;opacity:.45}
/* prev/next：实一点，背景不透明，有层级感 */
.cover-item.prev{transform:translate(-50%,-50%) translateX(-80px) scale(.70);z-index:2}
.cover-item.next{transform:translate(-50%,-50%) translateX(80px) scale(.70);z-index:2}
.cover-item.prev .cover-wrap,.cover-item.next .cover-wrap{width:150px;height:auto;padding:7px 7px 44px;border-radius:20px;box-shadow:0 5px 16px rgba(0,0,0,.15);background:rgb(252,232,237)}
.cover-item.prev .cover-inner,.cover-item.next .cover-inner{width:136px;height:136px;border-radius:16px;opacity:.88}
.cover-item.center{transform:translate(-50%,-50%) translateX(0) scale(1);opacity:1;z-index:5}
.cover-item.center .cover-wrap{width:150px;height:auto;padding:7px 7px 14px;border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.cover-item.center .cover-inner{width:136px;height:136px;border-radius:16px}
/* 歌词3行（小字） */
.lyrics{text-align:center;padding:4px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;overflow:hidden;flex-shrink:0}
.lyric-line{font-size:11px;color:var(--text2);line-height:1.4;opacity:.35;transition:all .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;filter:blur(.4px)}
.lyric-line.active{opacity:1;font-weight:600;font-size:12px;line-height:1.4;filter:none}
.lyric-line.active span{
  display:inline-block;
  background-image:linear-gradient(to right,var(--pink-deep) var(--lit-pct,0%),var(--text2) var(--lit-pct,0%));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
/* fallback渐变高亮（无yrc时用background-clip） */
.lyric-line.active.grad-lyric{
  background-clip:text;-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  background-image:linear-gradient(to right, var(--pink-deep) var(--lyric-pct,0%), var(--text2) var(--lyric-pct,0%));
}
/* 控制胶囊（参考图二：更薄，无时间，爱心圈） */
.controls-capsule{margin:6px 28px 0;padding:7px 12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(28px) saturate(180%) brightness(1.08);backdrop-filter:blur(28px) saturate(180%) brightness(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.70),0 2px 14px rgba(0,0,0,.09);border:.5px solid rgba(255,255,255,.50);border-radius:999px;flex-shrink:0}
.ctrl-left{display:flex;align-items:center;gap:1px;flex-shrink:0}
.ctrl-mid{flex:1;min-width:0;padding:0 4px}
.ctrl-right{display:flex;align-items:center;gap:2px;flex-shrink:0}
.ctrl-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);padding:3px;transition:color .2s;-webkit-tap-highlight-color:transparent}
.ctrl-btn:active{opacity:.7}
.ctrl-btn.play-btn{background:none;padding:3px;color:var(--pink-deep)}
.ctrl-btn svg{width:17px;height:17px;fill:currentColor}
.ctrl-btn.play-btn svg{fill:currentColor}
.ctrl-btn.fav-circle{width:24px;height:24px;padding:2px;color:var(--pink-deep)}
.ctrl-btn.fav-circle svg{width:18px;height:18px}
.progress-bar{width:100%;height:3px;background:rgba(224,112,144,.18);border-radius:2px;position:relative;cursor:pointer}
.progress-fill{height:100%;background:var(--pink-deep);border-radius:2px;transition:none}
.progress-dot{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:8px;height:8px;background:var(--pink-deep);border-radius:50%}
/* 播放tab：心动/推荐/歌单 */
.play-tab-bar{display:flex;margin:10px 16px 0;background:rgba(255,255,255,.2);border-radius:999px;padding:3px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.3);flex-shrink:0}
.play-tab{flex:1;text-align:center;padding:7px 0;font-size:13px;color:var(--text2);border-radius:999px;cursor:pointer;transition:.2s;font-weight:500}
.play-tab.active{background:rgba(255,255,255,.78);color:var(--pink-deep);font-weight:600;box-shadow:0 2px 8px rgba(224,112,144,.15)}
/* 歌单列表：占播放页剩余高度，内部滚动 */
.song-list{list-style:none;padding:0 12px calc(56px + env(safe-area-inset-bottom,0));flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.song-item{display:flex;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer;gap:10px;transition:background .15s}
.song-item:active{background:rgba(242,168,192,.1)}
.song-item.playing .si-name{color:var(--pink-deep);font-weight:600}
.si-cover{width:42px;height:42px;border-radius:6px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,var(--pink),var(--pink-deep));display:flex;align-items:center;justify-content:center;font-size:16px}
.si-cover img{width:100%;height:100%;object-fit:cover}
.si-info{flex:1;min-width:0}
.si-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-sub{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-play-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text2)}
.si-play-icon svg{width:20px;height:20px;fill:currentColor;margin-left:2px}
/* ====== 搜索页 ====== */
.search-page{padding:16px 16px calc(72px + env(safe-area-inset-bottom,0))}
.search-bar{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:0 16px;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;border:none;outline:none;font-size:15px;padding:12px 0;background:none;color:var(--text)}
.search-bar input::placeholder{color:var(--text2)}
.search-btn{background:none;border:none;cursor:pointer;font-size:18px;color:var(--pink-deep);padding:4px}
.result-list{list-style:none}
.result-item{display:flex;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;gap:10px;transition:background .15s}
.result-item:active{background:rgba(242,168,192,.1)}
.ri-cover{width:44px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,var(--pink),var(--pink-deep));display:flex;align-items:center;justify-content:center;font-size:20px}
.ri-cover img{width:100%;height:100%;object-fit:cover}
.ri-info{flex:1;min-width:0}
.ri-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-sub{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-add{background:none;border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--pink-deep);cursor:pointer}
/* ====== 我的页 ====== */
.my-page{padding:0;overflow-y:auto}
.my-header{background:linear-gradient(180deg,rgba(242,168,192,.45) 0%,transparent 100%);padding:28px 20px 20px;text-align:center}
.my-avatar-img{width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 16px rgba(224,112,144,.3);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pink),var(--pink-deep));font-size:36px}
.my-avatar-img img{width:100%;height:100%;object-fit:cover}
.my-nickname{font-size:20px;font-weight:700;margin-bottom:4px}
.my-badges{font-size:12px;color:var(--text2);margin-bottom:14px}
.my-stats{display:flex;justify-content:center}
.stat-item{flex:0 0 80px;text-align:center;padding:0 4px}
.stat-num{font-size:17px;font-weight:700}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px}
/* 快捷按钮 */
.my-quick{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:14px 12px;background:var(--card);margin-bottom:10px}
.q-btn{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:4px 0}
.q-icon{width:44px;height:44px;border-radius:14px;background:#fdf0f5;display:flex;align-items:center;justify-content:center;font-size:20px}
.q-label{font-size:11px;color:var(--text2)}
/* 我的内容tabs */
.my-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;margin-bottom:0}
.my-tab{flex:1;max-width:80px;text-align:center;padding:12px 0;font-size:14px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.my-tab.active{color:var(--pink-deep);border-bottom-color:var(--pink-deep);font-weight:600}
/* 歌单 */
.my-playlist-area{background:var(--card);padding-bottom:80px}
.my-fav-row{display:flex;align-items:center;padding:14px 16px;gap:12px;cursor:pointer;border-bottom:1px solid var(--border)}
.my-fav-cover{width:50px;height:50px;border-radius:8px;background:linear-gradient(135deg,#ff6b8a,#e0407a);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.my-fav-info{flex:1}
.my-fav-name{font-size:15px;font-weight:600}
.my-fav-count{font-size:12px;color:var(--text2);margin-top:2px}
.my-fav-mode{font-size:11px;color:var(--pink-deep);white-space:nowrap}
.my-pl-item{display:flex;align-items:center;padding:12px 16px;gap:12px;cursor:pointer;transition:.15s;border-bottom:1px solid var(--border)}
.my-pl-item:active{background:var(--bg)}
.my-pl-cover{width:50px;height:50px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,var(--pink),var(--pink-deep));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.my-pl-cover img{width:100%;height:100%;object-fit:cover}
.my-pl-info{flex:1;min-width:0}
.my-pl-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-pl-desc{font-size:12px;color:var(--text2);margin-top:2px}
.my-new-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.my-new-icon{width:50px;height:50px;border-radius:8px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text2);flex-shrink:0}
.login-prompt{padding:40px 20px;text-align:center}
.login-prompt p{color:var(--text2);font-size:14px;margin-bottom:16px}
.qr-wrap{margin:16px auto;width:180px;height:180px;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.qr-wrap img{width:100%;height:100%}
.qr-tip{font-size:12px;color:var(--text2);margin-top:8px}
.login-btn{background:var(--pink-deep);color:#fff;border:none;border-radius:24px;padding:12px 32px;font-size:15px;cursor:pointer;box-shadow:var(--shadow)}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.playlist-card{background:var(--card);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 8px rgba(224,112,144,.08);transition:transform .15s}
.playlist-card:active{transform:scale(0.98)}
.pl-cover{width:52px;height:52px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,var(--pink),var(--pink-deep));display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pl-cover img{width:100%;height:100%;object-fit:cover}
.pl-info{flex:1}
.pl-name{font-size:14px;font-weight:500}
.pl-count{font-size:12px;color:var(--text2);margin-top:3px}
/* ====== 登录弹窗 ====== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.hidden{display:none}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:500px}
.modal-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:8px}
.modal-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:16px}
.modal-qr{width:200px;height:200px;margin:0 auto 12px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
.modal-qr img{width:100%;height:100%}
.modal-qr-tip{text-align:center;font-size:12px;color:var(--text2);margin-bottom:20px}
.modal-close{width:100%;background:none;border:1px solid var(--border);border-radius:24px;padding:12px;font-size:15px;color:var(--text2);cursor:pointer}
/* ====== 加载（画爱心动画） ====== */
.loading{text-align:center;padding:32px;color:var(--text2);font-size:14px}
.heart-loader{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;vertical-align:middle}
.heart-loader svg{width:100%;height:100%}
.heart-loader .hp{
  fill:none;stroke:var(--pink-deep);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:85;stroke-dashoffset:85;
  animation:drawHeart 1.6s ease-in-out infinite
}
@keyframes drawHeart{
  0%{stroke-dashoffset:85;opacity:.7}
  100%{stroke-dashoffset:-85;opacity:.7}
}
/* ====== 空状态 ====== */
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:12px}
/* ====== 侧边栏 ====== */
.sb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;opacity:0;pointer-events:none;transition:opacity .28s}
.sb-overlay.open{opacity:1;pointer-events:all}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:80%;max-width:320px;background:var(--bg);z-index:401;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sb-top{padding:calc(env(safe-area-inset-top,0) + 20px) 20px 16px;background:linear-gradient(160deg,rgba(242,168,192,.22) 0%,transparent 100%)}
.sb-user-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sb-avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;background:rgba(242,168,192,.3);flex-shrink:0;border:2px solid rgba(242,168,192,.5)}
.sb-avatar img{width:100%;height:100%;object-fit:cover}
.sb-user-info{flex:1;min-width:0}
.sb-nickname{font-size:16px;font-weight:700;color:var(--text)}
.sb-sub{font-size:12px;color:var(--text2);margin-top:2px}
.sb-top-icons{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.sb-icon-btn{background:none;border:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent}
.sb-icon-btn svg{width:20px;height:20px}
.sb-icon-btn:active{background:rgba(0,0,0,.06)}
.sb-divider{height:1px;background:var(--border);margin:0 20px}
.sb-menu{list-style:none;padding:8px 0}
.sb-item{display:flex;align-items:center;gap:16px;padding:14px 24px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
.sb-item:active{background:rgba(224,112,144,.08)}
.sb-item-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}
.sb-item-icon svg{width:22px;height:22px}
.sb-item-label{font-size:15px;color:var(--text)}
/* ====== 定时关闭弹窗 ====== */
.sleep-sheet{background:#1c1c1e;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));width:100%;max-width:500px;color:#fff}
.sleep-title{font-size:17px;font-weight:600;margin-bottom:16px}
.sleep-card{background:#2c2c2e;border-radius:14px;padding:16px;margin-bottom:12px}
.sleep-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sleep-row span{font-size:15px;font-weight:600}
.sleep-toggle{width:44px;height:26px;border-radius:13px;border:none;cursor:pointer;position:relative;transition:background .2s;background:#3a3a3c;flex-shrink:0}
.sleep-toggle.on{background:#e07090}
.sleep-toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sleep-toggle.on::after{transform:translateX(18px)}

<script>
const API = '/api/netease?key=xiaomao520';
const audio = document.getElementById('audio');

// 页面加载时：绑定本地真实WAV文件（78KB，iOS认为这是合法音频，激活audio element用）
// 不用 data URI 也不用 IndexedDB blob——本地文件最可靠，iOS绝对不拒绝
audio.src = '/unlock.wav';
audio.preload = 'auto';

// ====== Cookie工具 ======
// 把 Set-Cookie 格式（含 Max-Age/Path 等）解析成纯 Cookie 请求头格式
function parseCookieForHeader(setCookieStr) {
  if (!setCookieStr) return '';
  // 兼容两种格式：
  // 1. Set-Cookie头（逗号分隔）："MUSIC_U=xxx; Max-Age=..., NMTID=yyy; ..."
  // 2. NeteaseCloudMusicApi body.cookie（分号拼接）："MUSIC_U=xxx; Max-Age=...;NMTID=yyy; ..."
  // 方案：按所有 ; 和 , 分割，过滤掉 cookie 属性名，保留所有 name=value 对
  const ATTRS = /^(max-age|path|domain|expires|samesite|secure|httponly)(\s*=|$)/i;
  return setCookieStr
    .split(/[;,]+/)
    .map(p => p.trim())
    .filter(p => p && !ATTRS.test(p))
    .join('; ');
}

// ====== 心动/koko 歌单本地缓存 ======
function loadHeartCache() { try { return JSON.parse(localStorage.getItem('nease_heart_cache') || '[]'); } catch(e) { return []; } }
function saveHeartCache(songs) { try { localStorage.setItem('nease_heart_cache', JSON.stringify(songs)); } catch(e) {} }
function loadKokoCache() { try { return JSON.parse(localStorage.getItem('nease_koko_cache') || '[]'); } catch(e) { return []; } }
function saveKokoCache(songs) { try { localStorage.setItem('nease_koko_cache', JSON.stringify(songs)); } catch(e) {} }
// 合并多个歌单去重（以id为准）
function mergeSongsUnique(...lists) {
  const seen = new Set();
  return lists.flat().filter(s => { if (seen.has(s.id)) return false; seen.add(s.id); return true; });
}

// ====== 云端数据同步（歌单 + 壁纸，绕开iOS本地存储被清的问题）======
const CLOUD_API = 'https://screentime-tracker-mu.vercel.app/api/koko-data?key=xiaomao520';

async function cloudSavePlaylist(pl) {
  try {
    await fetch(CLOUD_API + '&type=playlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: pl }),
    });
  } catch(e) {}
}

async function cloudLoadPlaylist() {
  try {
    const r = await fetch(CLOUD_API + '&type=playlist');
    const j = await r.json();
    return Array.isArray(j.playlist) ? j.playlist : [];
  } catch(e) { return []; }
}

async function cloudSaveWallpaper(dataUrl) {
  try {
    await fetch(CLOUD_API + '&type=wallpaper', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: dataUrl }),
    });
  } catch(e) {}
}

async function cloudLoadWallpaper() {
  // 直接返回存在 Redis 里的 dataURL（不是远程URL）
  try {
    const r = await fetch(CLOUD_API + '&type=wallpaper');
    const j = await r.json();
    return j.url || null; // url 字段现在存的是 dataURL
  } catch(e) { return null; }
}

// 压缩图片再上传，避免超过服务器 body 大小限制
async function compressImage(dataUrl, maxWidth, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function cloudDeleteWallpaper() {
  try {
    await fetch(CLOUD_API + '&type=wallpaper', { method: 'DELETE' });
  } catch(e) {}
}

// ====== 状态 ======
let playlist = JSON.parse(localStorage.getItem('nease_playlist') || '[]');
let curIdx = parseInt(localStorage.getItem('nease_curIdx') || '0');
let cookie = localStorage.getItem('nease_cookie') || '';
let userInfo = JSON.parse(localStorage.getItem('nease_user') || 'null');
// 页面加载后批量预取所有歌曲URL（最多20首），随机点哪首都有缓存
setTimeout(() => prefetchAll(), 0);

// 如果playlist非空（localStorage有数据），主动同步到服务器（保证服务器有最新数据）
if (playlist.length) {
  cloudSavePlaylist(playlist); // 后台静默同步，不阻塞UI
  if (curIdx >= playlist.length) curIdx = 0;
  renderPlaylist();
  updateSongUI(playlist[curIdx] || playlist[0]);
  prefetchAll();
}
// 如果playlist为空，先从本地 heart/koko 缓存恢复（0秒，立刻有歌）
if (!playlist.length) {
  const merged = mergeSongsUnique(loadKokoCache(), loadHeartCache());
  if (merged.length) {
    playlist = merged;
    curIdx = 0;
    localStorage.setItem('nease_playlist', JSON.stringify(merged));
    renderPlaylist();
    updateSongUI(playlist[0]);
    prefetchAll();
  } else {
    // 本地缓存也没有，从云端恢复（兜底）
    cloudLoadPlaylist().then(pl => {
      if (pl.length && !playlist.length) {
        playlist = pl;
        localStorage.setItem('nease_playlist', JSON.stringify(pl));
        renderPlaylist();
        updateSongUI(playlist[curIdx] || playlist[0]);
        prefetchAll();
      }
    });
  }
}
let isPlaying = false;
let playMode = 1; // 0=循环 1=随机
let lyricLines = [];
let lyricTimers = [];
let qrTimer = null;

// 接收家里传来的登录状态（解决iOS iframe localStorage隔离问题）
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.action === 'setAuth') {
    if (e.data.cookie) {
      cookie = e.data.cookie;
      localStorage.setItem('nease_cookie', cookie);
    }
    if (e.data.user && e.data.user !== 'null') {
      try { userInfo = JSON.parse(e.data.user); localStorage.setItem('nease_user', e.data.user); } catch(_) {}
    }
  }
  // 家里发来壁纸，直接应用（跟随家里，不存到本地，下次打开家里会再发一次）
  if (e.data.action === 'setWallpaper') {
    _applyWallpaper(e.data.dataUrl || null);
  }
});

// 启动时：通知家里"我准备好了"，请求家里发cookie过来；同时把自己已有的cookie也发给家里存
if (window.parent !== window) {
  window.parent.postMessage({action:'kokoReady'}, '*');
  if (cookie) {
    window.parent.postMessage({action:'saveAuth', cookie:cookie, user:JSON.stringify(userInfo)}, '*');
  }
}

// 返回：在iframe里就通知家里关掉overlay，单独访问就正常history.back()
function goBack() {
  if (window.parent !== window) {
    window.parent.postMessage({action:'closeMusic'}, '*');
  } else {
    history.back();
  }
}

// ====== Tab切换 ======
let currentTab = 'play';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  updateCapsuleMid(tab);
  if (tab === 'my') renderMyPage();
}

// NeteaseCloudMusicApi读的是 query.cookie（URL参数），不是HTTP Cookie头
// 所以登录后的所有请求都把cookie放进URL参数里传
async function api(path, params = {}) {
  const allParams = { ...params };
  if (cookie) allParams.cookie = cookie; // 关键：cookie作为URL参数
  const qs = new URLSearchParams(allParams).toString();
  const url = `${API}&path=${encodeURIComponent(path)}${qs ? '&' + qs : ''}`;
  const res = await fetch(url);
  return res.json();
}

// ====== URL 预加载缓存（解决 iOS async play 限制）======
// 激活用的本地WAV文件——真实音频，iOS绝对不拒绝，不是data URI欺骗技巧
const UNLOCK_SRC = '/unlock.wav';
function getSilentUrl() { return UNLOCK_SRC; }

const _urlCache = {};
let _pendingPlay = null; // 等待预取完成后自动播放的歌曲id
let _audioSrcSongId = null; // 记录当前 audio.src 预设的是哪首歌（schedulePrefetch用）

async function _prefetchUrl(songId) {
  if (!songId || _urlCache[songId]) return;
  try {
    const d = await api('/song/url', { id: songId, br: 128000 });
    const url = d.data?.[0]?.url;
    if (url) {
      _urlCache[songId] = url;
      // 如果是当前歌且 audio 没在播放，预设 src（不 play）
      // 这样用户点播放时直接在手势里 play()，不需要 async，iOS 拦不住
      if (!isPlaying && !_pendingPlay && playlist[curIdx]?.id === songId) {
        audio.src = url;
        audio.preload = 'none';
        _audioSrcSongId = songId; // 记录预设的是哪首歌
      }
      // 如果用户在等这首歌（手势里已激活过audio），自动触发播放
      if (_pendingPlay === songId) {
        _pendingPlay = null;
        delete _urlCache[songId];
        audio.src = url;
        audio.muted = false;
        const pp = audio.play();
        if (pp) pp.catch(err => {
          showToast('播放失败: ' + (err?.name || err));
          isPlaying = false; setPlayIcon(false);
        });
        isPlaying = true; setPlayIcon(true);
        loadLyric(songId);
        localStorage.setItem('nease_curIdx', curIdx);
        schedulePrefetch();
      }
    }
  } catch(e) {}
}
function schedulePrefetch() {
  if (!playlist.length) return;
  const len = playlist.length;
  const cur = playlist[curIdx];
  if (cur) _prefetchUrl(cur.id);
  const next = playlist[(curIdx + 1) % len];
  if (next && next.id !== cur?.id) _prefetchUrl(next.id);
}

// 批量预取歌单所有歌的URL（最多20首，防止歌单太长时请求过多）
// 用于歌单加载完成时提前缓存，随机点歌不用等待
function prefetchAll() {
  if (!playlist.length) return;
  const limit = Math.min(playlist.length, 20);
  for (let i = 0; i < limit; i++) {
    _prefetchUrl(playlist[i].id);
  }
}

function _doPlay(url, songId) {
  // 同步执行：设 src 并立即 play（必须在手势上下文里或已有缓存URL时调用）
  audio.muted = false;
  if (audio.src !== url) audio.src = url; // src 没变就不重设，避免触发 abort
  const pp = audio.play();
  if (pp) pp.catch(err => {
    if (err?.name === 'AbortError') {
      // 资源还在加载，等 canplay 后重试
      audio.addEventListener('canplay', function once() {
        audio.removeEventListener('canplay', once);
        audio.play().catch(e2 => { showToast('播放失败: ' + (e2?.name || e2)); isPlaying = false; setPlayIcon(false); });
      }, { once: true });
    } else {
      showToast('播放错误: ' + (err?.name || err));
      isPlaying = false; setPlayIcon(false);
    }
  });
  isPlaying = true;
  setPlayIcon(true);
  loadLyric(songId);
  localStorage.setItem('nease_curIdx', curIdx);
  schedulePrefetch(); // 预加载下一首
}

async function playCur() {
  if (!playlist.length) return;
  const song = playlist[curIdx];
  updateSongUI(song);
  updateFavIcon();

  // ① 优先使用内存缓存（整段在手势同步上下文里，iOS 不会拦）
  const cached = _urlCache[song.id];
  if (cached) {
    delete _urlCache[song.id];
    _doPlay(cached, song.id);
    return;
  }

  // ① bis：audio.src 已经是这首歌的真实 URL（schedulePrefetch 提前设置了）直接 play
  // 必须确认是同一首歌的预设，防止播旧歌时切歌误用旧歌URL
  if (_audioSrcSongId === song.id) {
    const curSrc = audio.src;
    _audioSrcSongId = null;
    _doPlay(curSrc, song.id);
    return;
  }

  // ② 没有缓存：在手势里激活 audio，然后等预取完成自动播放
  audio.src = getSilentUrl();
  audio.muted = true;
  audio.play().catch(() => {}); // 激活 audio element（手势上下文里）
  _pendingPlay = song.id;       // 标记等待播放，预取完成后自动衔接
  _prefetchUrl(song.id);        // 立即开始预取（如果还没开始）
}

async function loadLyric(id) {
  document.getElementById('lyric-prev').textContent = '　';
  document.getElementById('lyric-cur').textContent  = '🎵';
  document.getElementById('lyric-next').textContent = '　';
  try {
    // 优先尝试 /lyric/new 获取逐字yrc格式
    const d = await api('/lyric/new', { id });
    const yrcRaw = d.yrc?.lyric || '';
    if (yrcRaw) {
      lyricLines = parseYrc(yrcRaw);
    } else {
      // fallback：普通lrc（同一接口返回）
      const lrcRaw = d.lrc?.lyric || '';
      lyricLines = parseLyric(lrcRaw);
    }
    // 若 /lyric/new 拿不到歌词，再试旧接口 /lyric
    if (!lyricLines.length) {
      try {
        const d2 = await api('/lyric', { id });
        lyricLines = parseLyric(d2.lrc?.lyric || '');
      } catch(e2) {}
    }
    if (!lyricLines.length) {
      document.getElementById('lyric-cur').textContent = '暂无歌词';
    }
  } catch(e) {
    // 接口报错fallback到/lyric
    try {
      const d2 = await api('/lyric', { id });
      lyricLines = parseLyric(d2.lrc?.lyric || '');
      if (!lyricLines.length) document.getElementById('lyric-cur').textContent = '暂无歌词';
    } catch(e2) {
      document.getElementById('lyric-cur').textContent = '暂无歌词';
    }
  }
}

// 解析yrc逐字格式（网易云）
// 格式：[行startMs,行durMs,0]<字startMs,字durMs,0>字内容
function parseYrc(raw) {
  const lines = [];
  raw.split('\n').forEach(line => {
    const lineM = line.match(/^\[(\d+),\d+,\d+\](.*)/);
    if (!lineM) return;
    const lineStart = parseInt(lineM[1]) / 1000;
    const content = lineM[2];
    const words = [];
    const re = /<(\d+),(\d+),\d+>([^<]*)/g;
    let m;
    while ((m = re.exec(content)) !== null) {
      const txt = m[3];
      if (!txt) continue;
      words.push({ start: parseInt(m[1]) / 1000, end: (parseInt(m[1]) + parseInt(m[2])) / 1000, text: txt });
    }
    if (words.length) {
      lines.push({ time: lineStart, words, text: words.map(w => w.text).join('') });
    }
  });
  return lines;
}

function parseLyric(raw) {
  return raw.split('\n').map(line => {
    const m = line.match(/\[(\d+):(\d+)\.(\d+)\](.*)/);
    if (!m) return null;
    const t = parseInt(m[1]) * 60 + parseFloat(m[2] + '.' + m[3]);
    return { time: t, text: m[4].trim(), words: null };
  }).filter(Boolean);
}

// 进度更新（RAF = 逐帧刷新，丝滑）
let _rafId = null;
let _lastActive = -1; // 上一次高亮的歌词行下标，避免无变化时重绘DOM

const LYRIC_OFFSET = 0.4; // 行切换提前量（秒）
const WORD_OFFSET = 0.8;  // 逐字高亮提前量（秒，比行切换更大）

function _rafTick() {
  const cur = audio.currentTime, dur = audio.duration || 1;
  const pct = (cur / dur * 100);
  const fill = document.getElementById('progressFill');
  if (fill) {
    fill.style.width = pct + '%';
    const dot = fill.nextElementSibling;
    if (dot) dot.style.left = pct + '%';
  }
  // 歌词同步（3行，逐字高亮）
  // lyricCur加偏移，让歌词稍微提前出现补偿延迟
  const lyricCur = cur + LYRIC_OFFSET;
  if (lyricLines.length) {
    let active = 0;
    for (let i = 0; i < lyricLines.length; i++) {
      if (lyricLines[i].time <= lyricCur) active = i;
    }
    if (active !== _lastActive) {
      _lastActive = active;
      const prevEl = document.getElementById('lyric-prev');
      const nextEl = document.getElementById('lyric-next');
      if (prevEl) prevEl.textContent = lyricLines[active-1]?.text || '　';
      if (nextEl) nextEl.textContent = lyricLines[active+1]?.text || '　';
    }
    // 当前行逐字（每帧更新lit状态）
    const curEl = document.getElementById('lyric-cur');
    if (curEl) {
      const line = lyricLines[active];
      if (line?.words?.length) {
        // yrc逐字高亮
        curEl.classList.remove('grad-lyric');
        const spans = curEl.querySelectorAll('span');
        if (spans.length !== line.words.length) {
          curEl.innerHTML = line.words.map(w => `<span>${w.text}</span>`).join('');
        }
        // 卡拉OK渐变：每个字用精确start/end时间计算填充百分比
        curEl.querySelectorAll('span').forEach((sp, i) => {
          const w = line.words[i];
          let pct;
          if (cur < w.start) pct = 0;
          else if (cur >= w.end) pct = 100;
          else pct = (cur - w.start) / (w.end - w.start) * 100;
          sp.style.setProperty('--lit-pct', pct.toFixed(1) + '%');
        });
      } else if (line) {
        // fallback：CSS渐变模拟从左到右高亮
        if (!curEl.classList.contains('grad-lyric') || curEl.dataset.lineIdx !== String(active)) {
          curEl.innerHTML = '';
          curEl.textContent = line.text || '　';
          curEl.classList.add('grad-lyric');
          curEl.dataset.lineIdx = String(active);
        }
        const lineStart = line.time;
        const lineEnd = lyricLines[active + 1]?.time || (lineStart + 5);
        const pct = Math.min(100, Math.max(0, (lyricCur - lineStart) / (lineEnd - lineStart) * 100));
        curEl.style.setProperty('--lyric-pct', pct.toFixed(1) + '%');
      }
    }
  }
  _rafId = requestAnimationFrame(_rafTick);
}

audio.addEventListener('play', () => {
  if (_rafId) cancelAnimationFrame(_rafId);
  _rafId = requestAnimationFrame(_rafTick);
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = 'playing';
  }
});
audio.addEventListener('pause', () => {
  if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = 'paused';
  }
});
audio.addEventListener('ended', () => {
  if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
  nextSong();
});
audio.addEventListener('durationchange', () => {
  if ('mediaSession' in navigator && audio.duration && !isNaN(audio.duration)) {
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration,
        playbackRate: audio.playbackRate,
        position: audio.currentTime
      });
    } catch(e) {}
  }
});

function fmt(s) {
  s = Math.floor(s) || 0;
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function seekTo(e) {
  const bar = document.getElementById('progressBar');
  const pct = e.offsetX / bar.offsetWidth;
  audio.currentTime = pct * (audio.duration || 0);
}
// 进度条 touch 拖拽
(function() {
  let dragging = false;
  function applySeek(clientX) {
    const bar = document.getElementById('progressBar');
    const rect = bar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    audio.currentTime = pct * (audio.duration || 0);
  }
  document.addEventListener('DOMContentLoaded', () => {
    const bar = document.getElementById('progressBar');
    bar.addEventListener('touchstart', e => { dragging = true; applySeek(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
    bar.addEventListener('touchmove', e => { if (dragging) { applySeek(e.touches[0].clientX); e.preventDefault(); } }, { passive: false });
    bar.addEventListener('touchend', () => { dragging = false; });
  });
})();

// 播放历史栈：记录听过的歌（存curIdx），最多保留50条
let playHistory = [];
function pushCurToHistory() {
  if (playlist.length > 0 && curIdx >= 0 && curIdx < playlist.length) {
    playHistory.push(curIdx);
    if (playHistory.length > 50) playHistory.shift();
  }
}
function prevSong() {
  if (playHistory.length > 0) {
    curIdx = playHistory.pop(); // 回到上一首听过的歌
  } else {
    curIdx = (curIdx - 1 + playlist.length) % playlist.length;
  }
  playCur();
}
function nextSong() {
  pushCurToHistory(); // 切走前先存当前
  if (playMode === 2) { // 单曲循环：重播当前
    if (audio) { audio.currentTime = 0; audio.play(); }
    return;
  }
  if (playMode === 1) curIdx = Math.floor(Math.random() * playlist.length);
  else curIdx = (curIdx + 1) % playlist.length;
  playCur();
}

async function openLogin() {
  document.getElementById('loginModal').classList.remove('hidden');
  document.getElementById('qrTip').textContent = '生成二维码中…';
  document.getElementById('qrBox').innerHTML = '<div class="heart-loader"><svg viewBox="0 0 24 24"><path class="hp" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>';
  try {
    // 1. 获取key（带设备信息，让网易云授权管理里显示 koko-music）
    const k = await api('/login/qr/key', { type: 1 });
    const unikey = k.data?.unikey;
    if (!unikey) { document.getElementById('qrTip').textContent = '获取二维码失败'; return; }
    // 2. 生成二维码
    const q = await api('/login/qr/create', { key: unikey, qrimg: true });
    const qrImg = q.data?.qrimg;
    document.getElementById('qrBox').innerHTML = qrImg ? `<img src="${qrImg}" style="width:100%;height:100%">` : '<div class="spin">⏳</div>';
    document.getElementById('qrTip').textContent = '用手机网易云音乐扫码登录';
    // 3. 轮询状态（1秒一次）
    // qrSession：把NMTID以 cookie= URL参数形式传给netease-api（不是Cookie头！）
    // 因为NeteaseCloudMusicApi读的是 query.cookie，不是HTTP Cookie头
    let qrSession = '';
    if (qrTimer) clearInterval(qrTimer);
    qrTimer = setInterval(async () => {
      try {
        // cookie作为URL参数传入（netease-api的createOption读query.cookie）
        const cookieParam = qrSession ? `&cookie=${encodeURIComponent(qrSession)}` : '';
        const checkUrl = `${API}&path=${encodeURIComponent('/login/qr/check')}&key=${encodeURIComponent(unikey)}${cookieParam}`;
        const res = await fetch(checkUrl);
        const s = await res.json();
        // 调试：显示当前状态
        document.getElementById('qrTip').textContent = `状态 ${s.code} | sess:${qrSession.slice(0,15)||'空'} | ck:${(s.cookie||'').slice(0,15)}`;
        // 每次都更新qrSession（801/802都要存，803前需要最新的cookie）
        // s.cookie（响应体）优先于 s._cookie（Set-Cookie头，可能不完整）
        const rawSess = s.cookie || s._cookie || '';
        if (rawSess) qrSession = parseCookieForHeader(rawSess);
        if (s.code === 802) {
          document.getElementById('qrTip').textContent = `✅ 扫码成功，网易云确认中… sess:${qrSession.slice(0,20)}`;
        }
        if (s.code === 803) {
          clearInterval(qrTimer);
          // 登录成功：从响应体取 cookie，解析成纯 name=value 格式（去掉 Max-Age/Path 等）
          // s.cookie（body）优先，包含完整的 MUSIC_U + NMTID + __csrf
          const rawCookie = s.cookie || s._cookie || '';
          cookie = parseCookieForHeader(rawCookie) || qrSession;
          document.getElementById('qrTip').textContent = `803✓ raw:${rawCookie.slice(0,30)} → parsed:${cookie.slice(0,30)}`;
          if (cookie) {
            localStorage.setItem('nease_cookie', cookie);
            await fetchUserInfo();
            loadLikedSongs(); // 异步加载心动歌单，不阻塞登录流程
            closeLogin();
            showToast('🎉 登录成功！');
            renderMyPage();
            // 登录成功：把cookie回传给家里保存（防iOS iframe存储被清）
            if (window.parent !== window) {
              window.parent.postMessage({action:'saveAuth', cookie:cookie, user:JSON.stringify(userInfo)}, '*');
            }
          } else {
            // cookie为空时尝试直接拉用户信息
            await fetchUserInfo();
            if (userInfo) { closeLogin(); showToast('🎉 登录成功！'); renderMyPage(); }
            else { document.getElementById('qrTip').textContent = '登录成功但获取信息失败，请重试'; }
          }
        } else if (s.code === 800) {
          document.getElementById('qrTip').textContent = '二维码已过期，点取消后重新登录';
          clearInterval(qrTimer);
        } else if (s.code === 802) {
          document.getElementById('qrTip').textContent = '✅ 扫码成功，请在网易云App确认…';
        }
      } catch(e) {}
    }, 1000);
  } catch(e) { document.getElementById('qrTip').textContent = '获取失败，请稍后重试'; }
}

  if (qrTimer) clearInterval(qrTimer);

(function() {

  document.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = startX < 30;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!tracking) return;

    if (dx > 60 && dy < 60) openSidebar();

    tog.classList.add('on');
    btns.forEach(b => b.classList.toggle('active', parseInt(b.textContent) === _sleepMin));
  } else {
    tog.classList.remove('on');
    btns.forEach(b => b.classList.remove('active'));
  }
}
function setSleepMin(min) {
  _sleepMin = min;
  if (_sleepTimer) clearTimeout(_sleepTimer);
  if (_sleepCountdownInterval) clearInterval(_sleepCountdownInterval);
  _sleepEndTime = Date.now() + min * 60000;
  _sleepTimer = setTimeout(() => {
    if (document.getElementById('sleepFinish').checked) {
      audio.addEventListener('ended', () => { audio.pause(); isPlaying=false; setPlayIcon(false); }, { once: true });
    } else {
      audio.pause(); isPlaying=false; setPlayIcon(false);
    }
    _sleepTimer = null; _sleepMin = null; _sleepEndTime = null;
    updateSleepCountdownLabel();
  }, min * 60000);
  _sleepCountdownInterval = setInterval(updateSleepCountdownLabel, 1000);
  updateSleepUI();
  updateSleepCountdownLabel();
  showToast(`定时 ${min} 分钟后停止`);
}
function toggleSleepTimer() {
  if (_sleepTimer) {
    clearTimeout(_sleepTimer); clearInterval(_sleepCountdownInterval);
    _sleepTimer=null; _sleepMin=null; _sleepEndTime=null;
    updateSleepUI(); updateSleepCountdownLabel();
    showToast('已取消定时');
  } else if (_sleepMin) {
    setSleepMin(_sleepMin);
  } else {
    setSleepMin(30);
  }
}
function customSleepMin() {
  const v = prompt('输入分钟数（1-240）');
  const n = parseInt(v);
  if (n > 0 && n <= 240) setSleepMin(n);
}
function updateSleepCountdownLabel() {
  const el = document.getElementById('sleepCountdownLabel');
  if (!el) return;
  if (!_sleepTimer || !_sleepEndTime) { el.textContent = ''; return; }
  const left = Math.max(0, Math.ceil((_sleepEndTime - Date.now()) / 1000));
  const m = Math.floor(left / 60), s = left % 60;
  el.textContent = ` · ${m}:${String(s).padStart(2,'0')}`;
}

// ====== 壁纸 localStorage（参考家里聊天界面，简单可靠）======
function _wpSave(dataUrl) {
  try { localStorage.setItem('koko_wallpaper', dataUrl); } catch(e) {}
}
function _wpLoad() {
  return localStorage.getItem('koko_wallpaper') || null;
}
function _wpDel() {
  try { localStorage.removeItem('koko_wallpaper'); } catch(e) {}
}
function _applyWallpaper(url) {
  if (url) {
    document.body.style.backgroundImage = `url(${url})`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
  } else {
    document.body.style.backgroundImage = '';

}
function handleWallpaperUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    const dataUrl = e.target.result;
    // 先本地应用（即时生效）
    _applyWallpaper(dataUrl);
    showToast('壁纸设置中…');
    // 压缩（参考家里：1080px / q0.78），存到localStorage + 服务器备份
    const compressed = await compressImage(dataUrl, 1080, 0.78);
    _wpSave(compressed);
    cloudSaveWallpaper(compressed); // 后台备份到服务器，不阻塞
    showToast('壁纸已设置');
  };
  reader.readAsDataURL(file);
}
function setWallpaper(url) {
  if (url) {
    _wpSave(url);
    _applyWallpaper(url);
    showToast('壁纸已设置');
  } else {
    _wpDel();
    cloudDeleteWallpaper();
    _applyWallpaper(null);
    showToast('已恢复默认');
  }
}
// 初始化壁纸（同步读localStorage，即时恢复）
// iOS清了localStorage时从服务器备份恢复
(function() {
  const localWp = _wpLoad();
  if (localWp) {
    _applyWallpaper(localWp);
  } else {
    // 本地没有，从服务器恢复
    cloudLoadWallpaper().then(cloudData => {
      if (cloudData) {
        _applyWallpaper(cloudData);
        _wpSave(cloudData); // 存回localStorage
      }
    });
  }
})();

// ====== 听歌识曲 ======
let _shazamMode = 'listen', _shazamRecorder = null, _shazamChunks = [], _shazamRecording = false;
function openShazam() {
  closeSidebar();
  document.getElementById('shazamPage').classList.add('open');
  resetShazam();
}
function closeShazam() {
  document.getElementById('shazamPage').classList.remove('open');
  if (_shazamRecorder && _shazamRecording) { _shazamRecorder.stop(); _shazamRecording = false; }
}
function setShazamMode(mode) {
  _shazamMode = mode;
  document.getElementById('shazamTabListen').classList.toggle('active', mode === 'listen');
  document.getElementById('shazamTabHum').classList.toggle('active', mode === 'hum');
  resetShazam();
}
function resetShazam() {
  document.getElementById('shazamTitle').textContent = _shazamMode === 'listen' ? '点击识别歌曲' : '点击哼唱识曲';
  document.getElementById('shazamSub').textContent = _shazamMode === 'listen' ? '对着手机播放音乐' : '哼唱几秒钟旋律';
  document.getElementById('shazamBtn').style.background = 'var(--pink-deep)';
  _shazamRecording = false;
}
async function toggleShazam() {
  if (_shazamRecording) {
    // 停止录音
    if (_shazamRecorder) _shazamRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _shazamChunks = [];
    _shazamRecorder = new MediaRecorder(stream);
    _shazamRecorder.ondataavailable = e => { if (e.data.size) _shazamChunks.push(e.data); };
    _shazamRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      _shazamRecording = false;
      document.getElementById('shazamBtn').style.background = 'var(--pink-deep)';
      document.getElementById('shazamTitle').textContent = '识别中…';
      document.getElementById('shazamSub').textContent = '';
      const blob = new Blob(_shazamChunks, { type: 'audio/webm' });
      // 转base64发给VPS
      const reader = new FileReader();
      reader.onload = async ev => {
        const b64 = ev.target.result.split(',')[1];
        try {
          const d = await api('/song/recognize', { audio: b64 });
          const song = d.data?.songs?.[0];
          if (song) {
            document.getElementById('shazamTitle').textContent = song.name || '已识别';
            document.getElementById('shazamSub').textContent = (song.artists||[]).map(a=>a.name).join('/');
            // 加入播放列表
            const s = { id: song.id, name: song.name, artist: (song.artists||[]).map(a=>a.name).join('/'), cover: song.album?.blurPicUrl||song.album?.picUrl||'' };
            if (!playlist.find(p => p.id === s.id)) { playlist.push(s); savePlaylist(); }
            curIdx = playlist.findIndex(p => p.id === s.id);
            playCur();
            setTimeout(() => closeShazam(), 1500);
          } else {
            document.getElementById('shazamTitle').textContent = '未识别到歌曲';
            document.getElementById('shazamSub').textContent = '再试一次？';
          }
        } catch(e) { document.getElementById('shazamTitle').textContent = '识别失败'; document.getElementById('shazamSub').textContent = e.message||''; }
      };
      reader.readAsDataURL(blob);
    };
    _shazamRecorder.start();
    _shazamRecording = true;
    document.getElementById('shazamBtn').style.background = '#e05';
    document.getElementById('shazamTitle').textContent = '录音中…';
    document.getElementById('shazamSub').textContent = '点击停止';
    // 10秒后自动停止
    setTimeout(() => { if (_shazamRecording && _shazamRecorder) _shazamRecorder.stop(); }, 10000);
  } catch(e) {
    document.getElementById('shazamTitle').textContent = '无法访问麦克风';
    document.getElementById('shazamSub').textContent = '请允许麦克风权限';
  }
}

// ====== Toast ======
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;border-radius:20px;padding:8px 20px;font-size:13px;z-index:300;transition:opacity .3s'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity='0', 2000);
}

    switchPlayTab('heart');

    (async () => {
      try {
        const d = await api('/recommend/songs');
        let songs = (d.data?.dailySongs||[]).map(s => ({
          id:s.id, name:s.name,
          artist:(s.ar||s.artists||[]).map(a=>a.name).join('/'),
          cover:s.al?.picUrl||s.album?.picUrl||''
        }));
        songs = songs.sort(() => Math.random() - 0.5);
        window._prefetchedRecommend = songs;
        // 预取第一首URL，提前set进audio.src（iOS touchstart时直接play，不需要await）
        if (songs.length && !isPlaying) {
          const u = await api('/song/url', { id: songs[0].id, br: 128000 });
          const url = u.data?.[0]?.url;
          if (url && !isPlaying) { audio.src = url; window._prefetchedSong = songs[0]; }
        }
      } catch(_) {}
    })();
    // 后台预热koko歌单（切歌时updateKokoBtn能立刻响应）
    ensureKokoPlaylist().catch(() => {});
  }
  // iOS PWA：首次触摸时用合法src解锁audio
  document.addEventListener('touchstart', function unlockAudio() {
    audio.src = getSilentUrl();
    audio.muted = true;
    audio.play()
      .then(() => { audio.pause(); audio.muted = false; })
      .catch(() => { audio.muted = false; });
  }, { once: true, passive: true });
});

        <button onclick="setWallpaper(null)" style="padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--bg);font-size:13px;cursor:pointer">默认（无壁纸）</button>
        <button onclick="document.getElementById('wallpaperInput').click()" style="padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:none;font-size:13px;cursor:pointer">上传图片</button>
        <input type="file" id="wallpaperInput" accept="image/*" style="display:none" onchange="handleWallpaperUpload(this)">
      </div>
    </div>
    <div class="dress-section" style="padding-top:0">
      <button onclick="closeDressModal()" style="width:100%;padding:12px;border-radius:24px;border:1px solid var(--border);background:none;font-size:15px;color:var(--text2);cursor:pointer">完成</button>
    </div>
  </div>
</div>
</body>
</html>
